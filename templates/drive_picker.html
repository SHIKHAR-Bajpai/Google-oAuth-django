<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Drive Picker</title>
    <script src="https://apis.google.com/js/api.js"></script>
</head>
<body>
    <button onclick="openPicker()">Pick a File</button>

    <script>
        const CLIENT_ID = "YOUR_GOOGLE_CLIENT_ID";
        const API_KEY = "YOUR_GOOGLE_API_KEY";
        const SCOPE = "https://www.googleapis.com/auth/drive.file";

        function openPicker() {
            gapi.load("auth2", function () {
                gapi.auth2.authorize(
                    { client_id: CLIENT_ID, scope: SCOPE },
                    function (authResult) {
                        if (authResult && !authResult.error) {
                            gapi.load("picker", function () {
                                createPicker(authResult.access_token);
                            });
                        } else {
                            console.error("Auth Error", authResult);
                        }
                    }
                );
            });
        }

        function createPicker(accessToken) {
            const picker = new google.picker.PickerBuilder()
                .setOAuthToken(accessToken)
                .addView(google.picker.ViewId.DOCS)
                .setDeveloperKey(API_KEY)
                .setCallback(pickerCallback)
                .build();
            picker.setVisible(true);
        }

        function pickerCallback(data) {
            if (data.action === google.picker.Action.PICKED) {
                const fileId = data.docs[0].id;
                console.log("Selected File ID:", fileId);

                // Send file ID to Django backend
                fetch("http://127.0.0.1:8000/drive/upload/", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ file_id: fileId }),
                })
                .then(response => response.json())
                .then(data => console.log("Server Response:", data))
                .catch(error => console.error("Error:", error));
            }
        }
    </script>
</body>
</html>
