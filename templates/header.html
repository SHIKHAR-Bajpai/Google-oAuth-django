<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Google Integration & Chat</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.1.2/dist/tailwind.min.css" rel="stylesheet">
    <style>
        html, body {
            height: 100%;
        }
        body {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background-color: #f0f4f8;
        }
    </style>
</head>
<body >

<div class="font-sans leading-normal tracking-normal bg-gray-100 text-gray-800">

    <header class="py-8 shadow-md mt-2">
        <h1 class="text-4xl font-bold text-center text-blue-600 mb-2">Welcome to Google Integration & Real-Time Chat</h1>
    </header>

    <div class="container mx-auto flex flex-col justify-center items-center py-8">
        <div class="flex space-x-6 mb-4">
            <a href="/" class="bg-gray-500 text-white px-6 py-4 rounded-full hover:bg-gray-600 transition duration-300 ease-in-out">
                Home
            </a>

            {% if request.session.google_user %}
            <a href="/google/dashboard" class="bg-yellow-600 text-white px-6 py-4 rounded-full hover:bg-yellow-700 transition duration-300 ease-in-out">
                Dashboard
            </a>
            {% endif %}

            <a href="{% url 'list_drive_files' %}" class="bg-green-500 text-white px-6 py-4 rounded-full hover:bg-green-600 transition duration-300 ease-in-out">
                Google Drive 
            </a>

            <a href="/chat" class="bg-purple-500 text-white px-6 py-4 rounded-full hover:bg-purple-600 transition duration-300 ease-in-out">
                User Chat
            </a>

            {% if request.session.google_user %}
                
            <a href="/logout" class="flex justify-evenly bg-blue-500 text-white px-6 py-4 rounded-full hover:bg-blue-600 transition duration-300 ease-in-out">
                <img src="{{ request.session.google_user.picture }}" alt="Profile Image" class="w-6 h-6 rounded-full mr-2">
                <div>Logout</div></a>
            {% else %}
            <a href="/google/login" class="bg-blue-500 text-white px-6 py-4 rounded-full hover:bg-blue-600 transition duration-300 ease-in-out">
                Login 
            </a>
            {% endif %}
        </div>
    </div>
</div>
