{% include "header.html" %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat with {{ other_user.first_name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.1.2/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f0f4f8;
        }
        .chat-container {
            max-width: 600px;
            margin: auto;
            height: 80vh;
            display: flex;
            flex-direction: column;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .chat-box {
            flex-grow: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
        }
        .message {
            max-width: 80%;
            padding: 10px;
            border-radius: 12px;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }
        .message.sent {
            background-color: #3182ce;
            color: white;
            align-self: flex-end;
        }
        .message.received {
            background-color: #e2e8f0;
            color: black;
            align-self: flex-start;
        }
        .input-area {
            display: flex;
            padding: 10px;
            border-top: 1px solid #ddd;
            background: white;
        }
        .input-area input {
            flex-grow: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
        }
        .input-area button {
            margin-left: 8px;
            padding: 10px 15px;
            background-color: #3182ce;
            color: white;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: background 0.3s;
        }
        .input-area button:hover {
            background-color: #2b6cb0;
        }
    </style>
</head>
<body>

<div class="container mx-auto mt-10">
    <div class="chat-container">
        <div class="bg-blue-600 text-white py-3 px-5 text-lg font-semibold">
            {{ other_user.first_name }}
        </div>

        <div id="chat-box" class="chat-box">
            {% for msg in messages %}
                <div class="message {% if msg.sender == request.user %}sent{% else %}received{% endif %}">
                    <strong>
                        {% if msg.sender == request.user %}
                            Me:
                        {% else %}
                            {{ msg.sender.first_name }}:
                        {% endif %}
                    </strong> {{ msg.message }}
                </div>
            {% endfor %}
        </div>

        <div class="input-area">
            <input type="text" id="message-input" placeholder="Type a message...">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>
</div>

<script>
    const username = "{{ request.user.username }}";
    const chatSocket = new WebSocket(
        `ws://${window.location.host}/ws/chat/{{ other_user.username|urlencode }}/`
    );

    chatSocket.onmessage = function(event) {
        const data = JSON.parse(event.data);
        const chatBox = document.getElementById("chat-box");

        const newMessage = document.createElement("div");
        newMessage.classList.add("message");
        newMessage.classList.add(data.sender === username ? "sent" : "received");

        newMessage.innerHTML = `<strong>${data.sender === username ? "Me" : data.sender}:</strong> ${data.message}`;
        
        chatBox.appendChild(newMessage);
        chatBox.scrollTop = chatBox.scrollHeight; // Auto-scroll to the latest message
    };

    function sendMessage() {
        const messageInput = document.getElementById("message-input");
        const message = messageInput.value.trim();

        if (message !== "") {
            chatSocket.send(JSON.stringify({ "message": message }));
            messageInput.value = "";
        }
    }
</script>

</body>
</html>
